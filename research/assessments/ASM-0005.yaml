notes: "WU017 baseline (preserved): Evidence base was 5/5 linked EVD annotated. Independence: three effective evidentiary threads across five records. EVD-000003 and EVD-000025 are two separate atomic EVD records that report the same underlying fact (99.5% service regularity, 84.4% IP-5min punctuality, delays attributed to congestion on Historic Centre/Industrial Park access routes) from the same primary source (SRC-0018, the 2026 municipal transport-authority annual report) and are treated as one evidentiary thread, not two, under lineage_id MOB-2026-07-CME-TRANSPORT-AUTHORITY-ANNUAL-REPORT (the same lineage_id already used for PRB-0001's EVD-000002/EVD-000023/EVD-000024, since it is literally the same source document). EVD-000007 and EVD-000008 similarly share SRC-0018's PUE-mobility counterpart, SRC-0017 (PUE Sector Report: Mobilidade), under lineage_id MOB-2025-02-PUE-MOBILIDADE-SECTOR-REPORT (also shared with PRB-0003's EVD-000004/EVD-000006, since again it is the same underlying document). EVD-000012 (SRC-0003, 2026 PUE participation report) is the third, genuinely independent thread; it is canonically linked to both PRB-0004 and PRB-0005 in the corpus, so its analysis.related_problems lists both, not a new speculative link. Structure decision: per handoff §6, the traffic/congestion, parking-pressure/illegal-parking, and pedestrian-space-conflict sub-mechanisms documented across EVD-000003/EVD-000007/EVD-000008/EVD-000025 remain analytically distinguishable (EVD-000007/EVD-000003/EVD-000025 speak mainly to traffic/congestion; EVD-000008 speaks mainly to parking/legibility), but the current evidence base does not establish sufficiently distinct affected journeys or consequences for each sub-mechanism to justify another canonical split during this D3 baseline — the road-surface/maintenance mechanism has already been correctly separated as PRB-0010, and no further split is authorized here; structure_action remains KEEP. civic_importance: reach and frequency are HIGH because traffic/parking/pedestrian conflict is described as affecting a broad daily-use population (residents, drivers, pedestrians) across 'key urban areas'; persistence is HIGH given the multi-year documentation trail; severity is MEDIUM because accident/safety concerns are recorded but not extensively quantified; equity is UNKNOWN because no record differentiates impact by population group. This integrated the WU017 project-owner baseline in full; no deviation from that handoff's structure_action/triage/gate values. WU018 (WU-D3-05) update: a bounded current data/status check was performed for parking/traffic/public-space technology and information; per the handoff's explicit instruction, no new canonical EVD was created — PRB-0005's existing linked set (EVD-000003/EVD-000007/EVD-000008/EVD-000012/EVD-000025) already covers the parking-technology/sensor/PUE-report content the bounded check re-confirmed, and a new EVD is not warranted merely to refresh an app-store timestamp or re-cite already-canonical planning material. Bounded-check findings, recorded in this ASM rather than as new evidence: parking maps/zones/tariffs/resident information already exist on municipal pages (eight paid-parking zones, consistent with EVD-000008's parking-pressure/legibility framing); Évora Mobilidade remains an operating parking-payment app (Play Store com.evoramove.urbanmotion, updated July 2026) — this reinforces, not newly establishes, the WU-D1/D2 finding that lack of a parking app is not the problem; 75 parking sensors, 10 vehicle-counting sensors and a supporting monitoring/management platform under LVpDÉ were already known and are part of the existing corpus (not re-cited as new); the bounded August 2026 check did NOT locate a current official public interface/API exposing live parking occupancy from those sensors, current per-sensor operational status, or a stable public machine-readable occupancy feed. This absence-of-finding is explicitly recorded as NOT evidence that the sensors are offline or that the data are unavailable internally (per handoff §4.3) — it is an unresolved public-data/interface question, not a negative finding about the sensors themselves. The Urban Platform app (com.ubp.evora) is current but its public store description does not establish or rule out real-time parking-occupancy exposure; no inference either way was drawn. Because the canonical corpus plus this bounded check now adequately describe the payment/information/sensor/platform solution landscape (app, sensors, monitoring platform, tariff/zone information), existing_solution_understanding is revised PARTIAL → SUFFICIENT — we now have a materially complete picture of what solutions already exist, even though whether they close the gap remains open. decision_gates.digital_causality is revised NOT_ASSESSED → PARTIAL: this is an explicit interpretation that a plausible-but-unproven data/legibility mechanism exists (whether current, public, reusable occupancy/performance data would materially improve the parking/traffic/pedestrian conflict), not a claim that digital causality is established — PASS was deliberately not set, per the handoff's explicit instruction. remaining_gap and decision_gates.remaining_gap_supported remain PARTIAL: the narrow data/legibility gap is now well-characterised, but D3 still lacks evidence that this narrow gap materially causes the broader traffic/parking/pedestrian conflict, and the lived/enforcement/pedestrian-impact journey component remains D5 work. structure_action remains KEEP; triage remains DEEPEN; no parking-app hypothesis was created. Desk-based D3 deepening for PRB-0005 is now SATURATED (handoff §8) — next value requires (a) a comparative/current-solution data-gap analysis of the narrow occupancy/legibility opportunity (D4-CARRY) and (b) lived/operational/pedestrian-impact evidence (D5-CARRY). No PRB-0005 structure_action or validation_status change; no new EVD created."
