notes: "WU017 baseline (preserved): Evidence base was 2/2 linked EVD annotated — PRB-0004's canonical linked set is unusually thin, and this thinness is itself the finding this ASM must record honestly rather than paper over. Independence: EVD-000005 (SRC-0017, PUE Mobilidade sector report, Feb 2025) and EVD-000012 (SRC-0003, 2026 PUE 4th-revision preventive-participation report) are on distinct source_ids, so they are not lineage-linked; independence is nonetheless assessed LOW rather than HIGH because both are institutional-voice records of the same type (municipal planning process) and neither is a lived cyclist signal — PRB-0004's own evidence_status is 'discovered', not 'corroborated', and D2-A explicitly recorded two separate rounds (Round A and a Targeted Follow-up) in which broad open-web search failed to surface any sufficiently strong, recent, Évora-specific lived signal, a documented method-limit rather than evidence of absence. EVD-000005's 0.5% cycling modal-share figure is flagged in its own notes as originating in the underlying diagnosis and not a 2026 measurement, which is why currentness is LOW. EVD-000012 is annotated REFINES because it shows current public concern about cycling-network programming (via the 2026 PUE participation process) without establishing which specific journeys are broken; it is also linked to PRB-0005 in the corpus (parking/circulation content in the same participation report) and its analysis.related_problems now lists both PRB-0004 and PRB-0005 to reflect that pre-existing canonical dual-linkage, not a new speculative cross-domain link. civic_importance was left UNKNOWN across all five dimensions and journey_understanding INSUFFICIENT / remaining_gap UNKNOWN because the corpus genuinely did not support a firmer value on any of them without inventing precision the evidence does not have. This integrated the WU017 project-owner baseline in full; no deviation from that handoff's structure_action/triage/gate values. WU018 (WU-D3-05) update: a bounded desk-based current-state check was performed (no new canonical EVD created, per the handoff's explicit instruction — no EVD for 'no complete dataset found', no EVD for the ciclovia.pt secondary inventory, no EVD for current PUE/PMUS planning material already represented by EVD-000012/EVD-000005). Bounded-audit result, recorded here rather than papered over: (1) cycling infrastructure exists in multiple corridors per a non-authoritative public inventory (ciclovia.pt, cited by URL/description only — Piscinas Municipais ~2.521 km, Estrada de Alcáçovas ~2.594 km, Avenida Condes de Vilalva ~1.337 km — used only as exploratory topology context, explicitly not canonicalized, not authoritative proof of August 2026 completeness); (2) the current 2026 PUE revision (already-canonical EVD-000012) still treats cycling-network programming/phasing (including Metrobus feasibility) as an unresolved planning question, not a completed operating network; (3) a current authoritative machine-readable/public topology of the complete operating network was not located in this bounded audit; (4) without that topology plus an actual origin-destination journey, the desk audit could not establish a defensible current broken everyday journey — this non-finding is itself the valid D3 result for PRB-0004, not a gap to be hidden. Because the bounded check distinguishes 'infrastructure exists in named corridors' from 'network programming/phasing remains unresolved' more specifically than the prior pure UNKNOWN, remaining_gap and decision_gates.remaining_gap_supported are revised UNKNOWN → PARTIAL — a narrow, honest upgrade in specificity, not a claim that the gap is closed or that journeys are now understood. journey_understanding remains INSUFFICIENT and decision_gates.journey_understood remains FAIL: the bounded audit explicitly could not determine which everyday journeys are broken. decision_gates.problem_real remains PARTIAL, decision_gates.digital_causality remains FAIL, digital_leverage remains low, triage remains DEEPEN, existing_solution_understanding remains PARTIAL. civic_importance is NOT upgraded from UNKNOWN on the strength of infrastructure/planning documents alone, per the handoff's explicit instruction — reach/frequency/severity/persistence/equity all remain UNKNOWN. evidence_confidence is unchanged (no new EVD; the two existing linked records and their LOW independence/LOW currentness assessment stand as before). Desk-based D3 deepening for PRB-0004 is now SATURATED (handoff §8) — next value requires a current authoritative network topology dataset plus real journey/cyclist validation (D5-CARRY / future topology evidence), not further generic cycling-mention search. No PRB-0004 structure_action or validation_status change; no new EVD created."
