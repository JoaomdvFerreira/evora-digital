next_action: "RS-02B1 (2026-08-12) established that official cycling-network cartography publicly exists (PMUSE), that the Municipality can supply structured geospatial formats on request (SHP/DWG/ECW regulation), and that the physical network has changed since the 2020 map baseline (recent completed works) — but a current, open, machine-readable operational layer remains publicly undemonstrated. Do not treat 'not publicly found' as 'does not exist'. Do not close WU022's DAM route (D5-OP-002) on the strength of this desk finding — DAM's confirmation of U2 (current operational GIS layer, format, reuse) is still the decisive next evidence. U1 (which everyday journeys are actually broken) remains a separate, unresolved bounded network/observation assessment; do not collect more generic cycling mentions."

notes: "RS-02B1 update (2026-08-12): PMUSE Volume I (EVD-000118, new SRC-0103) confirms official municipal cartography of the existing cycling network publicly exists (Figuras 73/74/78), distinguishing exclusively-cycling infrastructure (~8.5km) from shared pedestrian-cycling paths (~120km, mostly recreational), and reiterates the discontinuity diagnosis already established by EVD-000005 — but the underlying cartography is itself sourced/dated 2020 despite the report's 2025-09 publication. A 2017-based proposed network expansion (EVD-000119, Figura 85, ~18km new axes) is explicitly planned, not built, and is annotated PLANNED-SOLUTION, not EXISTING-SOLUTION. The Municipality's digital-cartography transfer regulation (EVD-000120, new SRC-0104) confirms structured-geospatial supply capability (dwg/shp/ecw/pdf) via a formal case-by-case request process — this is reuse capability, not an open/self-service dataset or API, and does not confirm a cycling-specific layer has ever been requested or kept current. A March 2025 municipal news item (EVD-000121, new SRC-0105) confirms at least one concrete pedestrian/cycling connection was completed since the 2020 map baseline (Bairro Nª Srª da Saúde to ponte do Xarrama, phase 1, €90,000) with a further phase in preparation, directly demonstrating that the 2020-dated plan cartography should not be read as necessarily representing the present-day operational network. Per RS-01/RS-02B1 evidence discipline, 'no publicly downloadable machine-readable cycling dataset was located' is recorded strictly as a public-discoverability finding, not as proof no such operational dataset exists internally. Net effect: existing_solution_understanding is revised PARTIAL -> SUFFICIENT (the official-cartography/format-capability/recent-works picture is now materially more complete than the WU018 bounded-audit baseline); decision_gates.problem_real is revised PARTIAL -> PASS (the discontinuous/limited-extent network is now corroborated by a fresh, independently-published 2025 institutional planning document, not resting on the 2025-vintage-but-2020-sourced figures alone — see EVD-000005/EVD-000118); evidence_confidence.independence is revised LOW -> MEDIUM (four institutional records now span three distinct document types — mobility plan, cartography-transfer regulation, municipal news — beyond the original two planning reports, a materially more diverse institutional-voice base than the WU017/WU018 two-record set, even though all remain the same municipal publisher); evidence_confidence.currentness is revised LOW -> MEDIUM (PMUSE Volume I is a 2025-09 publication and the news item is dated 2025-03, materially fresher than the historic 0.5% modal-share figure that previously anchored LOW, even though the cartography itself is 2020-sourced); evidence_confidence.overall is revised LOW -> MEDIUM accordingly. evidence_confidence.adequacy remains LOW (still no journey-level or lived-cyclist data) and journey_understanding remains INSUFFICIENT / decision_gates.journey_understood remains FAIL: none of this batch establishes which everyday origin-destination journeys are actually broken, which is why U1 is preserved unchanged and a new U2 (current operational GIS layer / format / reuse, institutional, target D5) is added rather than replacing U1. PRB-0004.evidence_status is revised discovered -> corroborated: the set has grown from 2 thin same-type planning records to 6 records spanning three institutional document types that reinforce rather than merely repeat each other, satisfying the ordinary sense of 'corroborated' the schema's DISCOVERED -> CORROBORATED lifecycle step describes, without claiming journey-level validation. digital_leverage remains low; triage remains DEEPEN; structure_action remains KEEP; no PRB-0004 validation_status change; WU022's DAM route (D5-OP-002) is not closed by this desk finding. WU017 baseline (preserved): Evidence base was 2/2 linked EVD annotated — PRB-0004's canonical linked set is unusually thin, and this thinness is itself the finding this ASM must record honestly rather than paper over. Independence: EVD-000005 (SRC-0017, PUE Mobilidade sector report, Feb 2025) and EVD-000012 (SRC-0003, 2026 PUE 4th-revision preventive-participation report) are on distinct source_ids, so they are not lineage-linked; independence is nonetheless assessed LOW rather than HIGH because both are institutional-voice records of the same type (municipal planning process) and neither is a lived cyclist signal — PRB-0004's own evidence_status is 'discovered', not 'corroborated', and D2-A explicitly recorded two separate rounds (Round A and a Targeted Follow-up) in which broad open-web search failed to surface any sufficiently strong, recent, Évora-specific lived signal, a documented method-limit rather than evidence of absence. EVD-000005's 0.5% cycling modal-share figure is flagged in its own notes as originating in the underlying diagnosis and not a 2026 measurement, which is why currentness is LOW. EVD-000012 is annotated REFINES because it shows current public concern about cycling-network programming (via the 2026 PUE participation process) without establishing which specific journeys are broken; it is also linked to PRB-0005 in the corpus (parking/circulation content in the same participation report) and its analysis.related_problems now lists both PRB-0004 and PRB-0005 to reflect that pre-existing canonical dual-linkage, not a new speculative cross-domain link. civic_importance was left UNKNOWN across all five dimensions and journey_understanding INSUFFICIENT / remaining_gap UNKNOWN because the corpus genuinely did not support a firmer value on any of them without inventing precision the evidence does not have. This integrated the WU017 project-owner baseline in full; no deviation from that handoff's structure_action/triage/gate values. WU018 (WU-D3-05) update: a bounded desk-based current-state check was performed (no new canonical EVD created, per the handoff's