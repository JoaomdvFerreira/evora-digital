next_action: "RS-02B1 (2026-08-12) materially established that meaningful digital (TREVO web/app, TPAC GTFS) and planned physical (PMUSE stop/real-time/app improvements) passenger-information capability exists — do not frame PRB-0002 as simple absence of information channels. Do not close WU022's TREVO route (D5-OP-001) on the strength of this desk finding; it remains useful for operational/channel/delivery-status clarification. Map at least one concrete passenger journey with a current information failure (AFFECTED_JOURNEY, future WU023) to resolve U1; do not infer user difficulty merely from the existence of multiple channels."

notes: "RS-02B1 update (2026-08-12): PMUSE's action plan (EVD-000122, sources SRC-0016 + new SRC-0103) explicitly proposes passenger-information improvements — stop comfort/accessibility/information, real-time information at principal stops, and a multimodal-information app/website — each a planned/proposed action-table item, annotated PLANNED-SOLUTION; this must not be read as already delivered. PMUSE Volume I's own stop-level diagnosis (EVD-000123, new SRC-0103) documents concrete physical-channel heterogeneity: unsheltered stops carry only an operator/line identification plate, while sheltered stops carry a fuller line/stop/timetable panel that the plan itself flags as lacking accessibility elements (braille, audio announcements) — annotated REFINES. Together with the already-canonical TREVO web capability (EVD-000016) and TPAC's GTFS/Google Maps availability (EVD-000010), the problem should no longer be framed as simple absence of passenger-information channels: meaningful digital capability exists, and physical/informational improvements are identified and planned. journey_understanding is revised INSUFFICIENT -> PARTIAL and decision_gates.journey_understood FAIL -> PARTIAL: we now understand one concrete touchpoint-level failure mode (inconsistent, accessibility-incomplete stop signage) even though no full passenger journey has been mapped and no affected-person evidence has been gathered — U1 (frequency/severity of real journey failures) stays open and is explicitly AFFECTED_JOURNEY, deferred to future WU023, not started here. evidence_confidence.adequacy is revised LOW -> MEDIUM (stop-level specificity materially reduces the prior generic-channel-diversity uncertainty). evidence_confidence.independence remains MEDIUM, not increased: EVD-000122/EVD-000123 are the same PMUSE institutional-planning voice (SRC-0016/SRC-0103 share the same PMUSE Volume I/II programme, and SRC-0103 carries its own lineage_id MOB-2025-09-PMUSE-DIAGNOSIS-STRATEGY distinct from SRC-0019's CIMAC lineage), so this batch does not add a new independent evidentiary thread, only depth within an existing institutional-planning thread. Per RS-01/RS-02B1 evidence discipline: do not infer passenger difficulty merely from the existence of multiple information channels; do not treat PMUSE's proposed improvements as delivered; do not claim TREVO's client-rendered network-and-schedules page demonstrates timetable completeness (unchanged from EVD-000016's existing boundary). remaining_gap stays PARTIAL; digital_leverage remains not_assessed; structure_action remains KEEP; triage remains DEEPEN; no PRB-0002 validation_status change; WU022's TREVO route (D5-OP-001) is not closed by this desk finding. Evidence base (WU017/WU-D3-03 baseline, preserved): 4/4 linked EVD annotated. Independence: EVD-000010/EVD-000011 share one lineage (same CIMAC Avaliação Anual report, SRC-0019) via analysis.lineage_id; EVD-000016 (TREVO site direct observation) and EVD-000080 (Portal da Queixa complaints) are distinct, unshared sources — 3 effective evidentiary threads across 4 records, not 4 independent ones. WU-D3-03 owner decision (docs/milestones/D3-WU03-structure-review.md): PRB-0002 KEEP, narrowed to passenger-facing information quality/completeness/reliability/usability; structure_action updated SPLIT_CANDIDATE -> KEEP accordingly. The former U2 critical unknown (whether developer/data interoperability justifies a structural split) is resolved by that owner decision and removed from this ASM's active critical-unknown path; the underlying GTFS/API/licensing/reuse question is preserved as an Open Data Foundation/data-reuse lead in the structure review, not as a PRB-0002 blocker. decision_gates.civic_importance/root_cause_understood/remaining_gap_supported updated UNKNOWN -> PARTIAL per the WU015 pilot-review MODIFY resolution (meaningful-but-incomplete evidence existed for these gates; PARTIAL was not available when this ASM was first drafted). contradiction_status is 'degree of contradiction detected in the evidence base' (LOW = little/no contradiction), not 'confidence that no contradiction exists' (docs/discovery/d3-execution-protocol.md §5.1a). No PRB-0002.validation_status change."
