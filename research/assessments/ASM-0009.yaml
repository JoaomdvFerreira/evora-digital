notes: "Evidence base: 11/11 linked EVD annotated. Current-state stress test (primary pilot purpose for PRB-0009): EVD-000071/EVD-000072 (February 2026 communicado, lineage ENV-2026-02-RSU-DISRUPTION-COMMUNICADO) are marked temporal_relevance=HISTORICAL, not CURRENT — the February near-collapse remains real and important evidence of the problem's severity, but is not the assumed operating baseline as of this assessment, per PRB-0009's own preserved current-state correction. EVD-000095 (May 2026 four-vehicle normalisation) is marked CURRENT because the fact it reports (those vehicles entered service) is not superseded, even though it is chronologically older than August — temporal_relevance tracks whether a described state still holds, not merely how old the publish date is. EVD-000066/EVD-000073 share lineage ENV-2026-07-MUNICIPAL-STRUCTURAL-RESPONSE (both draw on SRC-0053, the July structural-response announcement); EVD-000065 was deliberately NOT grouped into that lineage despite also citing SRC-0053, because its own primary source (SRC-0054, a public meeting record) is a distinct document — lineage_id is assigned only on matching primary source_id, not on overlapping additional_sources or shared topic/publisher. Two EVD (EVD-000093, EVD-000094; distinct Facebook posts, different location/date, already noted as non-corroborating in D2) have temporal_relevance=UNKNOWN because their published_at is genuinely unknown with no contextual date anchor, unlike EVD-000096 (undated but contextually anchored to the post-July period, so marked CURRENT). Triage-semantics stress test (the other primary pilot purpose): digital_causality=FAIL because the dominant causal mechanism (ageing fleet, staffing/logistics, cross-entity responsibility) is not digitally addressable — this is a factual gate result, not a judgement that the civic problem is unimportant (civic_importance=PASS, reach=HIGH, severity=HIGH say the opposite). triage was deliberately set to WATCH rather than STOP specifically to avoid the STOP-reads-as-does-not-matter ambiguity the WU-D3-02 handoff warned about; this is flagged as an unresolved framework-semantic issue in docs/milestones/D3-WU02-pilot-review.md rather than silently resolved here. No PRB-0009.validation_status change; digital_leverage reuses PRB-0009.digital_tractability=low verbatim, not re-derived. decision_gates.remaining_gap_supported updated UNKNOWN -> PARTIAL in WU-D3-03 per the WU015 pilot-review MODIFY resolution (the core operational gap is well-characterized as non-digital; the narrow residual data/coordination gap is only partially characterized, which is meaningful-but-incomplete support, not an absence of evidence). triage remains WATCH; the STOP/WATCH-is-not-a-civic-importance-judgement clarification is now canonical (docs/discovery/d3-execution-protocol.md §5.2), so this ASM's original WATCH choice required no change."
