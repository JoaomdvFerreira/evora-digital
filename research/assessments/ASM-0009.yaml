notes: "Evidence base: 11/11 linked EVD annotated. Current-state stress test (primary pilot purpose for PRB-0009): EVD-000071/EVD-000072 (February 2026 communicado, lineage ENV-2026-02-RSU-DISRUPTION-COMMUNICADO) are marked temporal_relevance=HISTORICAL, not CURRENT — the February near-collapse remains real and important evidence of the problem's severity, but is not the assumed operating baseline as of this assessment, per PRB-0009's own preserved current-state correction. EVD-000095 (May 2026 four-vehicle normalisation) is marked CURRENT because the fact it reports (those vehicles entered service) is not superseded, even though it is chronologically older than August — temporal_relevance tracks whether a described state still holds, not merely how old the publish date is. EVD-000066/EVD-000073 share lineage ENV-2026-07-MUNICIPAL-STRUCTURAL-RESPONSE (both draw on SRC-0053, the July structural-response announcement); EVD-000065 was deliberately NOT grouped into that lineage despite also citing SRC-0053, because its own primary source (SRC-0054, a public meeting record) is a distinct document — lineage_id is assigned only on matching primary source_id, not on overlapping additional_sources or shared topic/publisher. Two EVD (EVD-000093, EVD-000094; distinct Facebook posts, different location/date, already noted as non-corroborating in D2) have temporal_relevance=UNKNOWN because their published_at is genuinely unknown with no contextual date anchor, unlike EVD-000096 (undated but contextually anchored to the post-July period, so marked CURRENT). Triage-semantics stress test (the other primary pilot purpose): digital_causality=FAIL because the dominant causal mechanism (ageing fleet, staffing/logistics, cross-entity responsibility) is not digitally addressable — this is a factual gate result, not a judgement that the civic problem is unimportant (civic_importance=PASS, reach=HIGH, severity=HIGH say the opposite). triage was deliberately set to WATCH rather than STOP specifically to avoid the STOP-reads-as-does-not-matter ambiguity the WU-D3-02 handoff warned about; this is flagged as an unresolved framework-semantic issue in docs/milestones/D3-WU02-pilot-review.md rather than silently resolved here. No PRB-0009.validation_status change; digital_leverage reuses PRB-0009.digital_tractability=low verbatim, not re-derived. decision_gates.remaining_gap_supported updated UNKNOWN -> PARTIAL in WU-D3-03 per the WU015 pilot-review MODIFY resolution (the core operational gap is well-characterized as non-digital; the narrow residual data/coordination gap is only partially characterized, which is meaningful-but-incomplete support, not an absence of evidence). triage remains WATCH; the STOP/WATCH-is-not-a-civic-importance-judgement clarification is now canonical (docs/discovery/d3-execution-protocol.md §5.2), so this ASM's original WATCH choice required no change. WU-D4-02 update (docs/milestones/D4-WU02-PRB0009-progress.md): the D4 existing-solution/gap analysis flagged by U3 at the WU-D3-05 baseline was performed. Local-solution baseline reconciled without duplicating existing SRC/EVD: the municipal occurrence-reporting platform (EVD-000067, EVD-000075, SRC-0057), Gesamb waste-service information (EVD-000074, SRC-0063), and the bulky/green-waste request journey (EVD-000097, SRC-0082) remain as already canonically recorded — this confirms, not newly establishes, that a generic 'citizens need an app to report and track municipal occurrences' gap is NOT SUPPORTED. Four bounded comparator records were integrated to characterize distinct plausible mechanisms, not to inflate evidence count: Havant (EVD-000108, REFINES) — resident collection-state visibility (Mechanism A); Oxford (EVD-000109, REFINES) — request/operational-system integration (Mechanism B); North Norfolk (EVD-000110, REFINES) — proactive known-delay/missed-route communication (Mechanism A variant), selected as the single canonicalized example of a pattern also seen at other UK councils (West Lancashire, West Lothian) which were reviewed but not separately canonicalized; and Lisbon (EVD-000111, REFINES) — Portuguese performance/evaluation-readiness publication (Mechanism C). Open311 was reviewed per the handoff but not canonicalized: Évora already has a municipal occurrence platform, so an interoperability-standard comparator is only relevant if a real integration/routing problem is demonstrated, which this bounded review did not establish — omitted to avoid creating a record that would not change the decision, consistent with the WU020 saturation finding. D4 residual-gap decision: PARTIAL (not SUPPORTED — D4 has not established that residents cannot report waste issues, that status/closure is universally absent, that lack of digital status is a material cause of poor collection, that public performance data would improve reliability, or that responsibility confusion is widespread; not NOT_SUPPORTED — the public review does not establish waste-specific collection status, proactive delayed/missed-route communication, occurrence-platform/collection-operations integration, a digital bulky/green request lifecycle, or public performance metrics, and comparators show these mechanisms are operationally plausible and common elsewhere). existing_solution_understanding remains SUFFICIENT; remaining_gap and decision_gates.remaining_gap_supported remain PARTIAL; decision_gates.digital_causality remains FAIL for the core operational mechanism (unchanged — this D4 review concerns only the narrow residual leads, not the dominant fleet/staffing/capacity cause); digital_leverage remains low (reused from PRB-0009.digital_tractability, not re-derived); structure_action remains KEEP; triage remains WATCH — a PARTIAL narrow residual gap coexists with WATCH at the core-problem level because the narrow lead is carried to D5/D6, not actively pursued as a build. No PRB-0009.validation_status change; no HYP-* created; PRB-0005/ASM-0005/WU019 records were not touched by this update."
