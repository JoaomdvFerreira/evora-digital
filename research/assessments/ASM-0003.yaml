notes: "Evidence base: 9/10 linked EVD annotated (per WU017 project-owner handoff); EVD-000030 (municipal service-ownership/data-owner directory, SRC-0027) is left unannotated because it is a governance/data-owner reference record, not a material contributor to barrier existence, journey, or civic-importance reasoning for this ASM. Independence: eight effective evidentiary threads across the nine material records — only EVD-000004 and EVD-000006 share a lineage (SRC-0017, the PUE Mobilidade sector report), assigned lineage_id MOB-2025-02-PUE-MOBILIDADE-SECTOR-REPORT; EVD-000009 (SRC-0016, PMUSE Volume II), EVD-000029 (SRC-0026, June 2026 Experimental Actions), EVD-000081 (SRC-0068, PRR EB1 Azaruja project record), EVD-000085 (SRC-0073, APCE Acesso Universal 1.3), EVD-000086 (SRC-0074, separate APCE Facebook post on cultural-facility verification), EVD-000087 (SRC-0075, Évora_27 Facebook post) and EVD-000088 (SRC-0076, Visit Portugal) are each on a distinct primary source_id and therefore distinct threads, even though EVD-000085/EVD-000086 share a publisher (APCE) — per the schema's explicit rule that lineage is never inferred from shared publisher alone. EXISTING-SOLUTION vs PLANNED-SOLUTION distinction matters here: EVD-000086 (APCE's continuing verification of municipal cultural facilities) is an operating, already-underway activity and is annotated EXISTING-SOLUTION, while EVD-000087 (Évora_27's accessibility plan, described as being 'developed... in 2026' with Acesso Cultura) is not yet delivered and is annotated PLANNED-SOLUTION — conflating the two would overstate how much of the barrier set is already resolved. EVD-000081 documents a concrete pre-intervention barrier at EB1 Azaruja but the corrective project is itself current/recent (2025-2026), so it is annotated CONFIRMS + CURRENT-STATE-UPDATE rather than a settled present-day fact. EVD-000088 is annotated with representativeness UNKNOWN and temporal_relevance UNKNOWN because both underlying public accessible-tourism surfaces lack a visible last-verified date. stakeholder_validation is PARTIAL rather than PENDING because EVD-000085 documents active participation by people with disabilities in identifying/improving barriers (a current process, not a completed validation) — stronger than a purely institutional claim but short of a completed formative check. civic_importance reach is MEDIUM (bounded to people with reduced mobility and other vulnerable pedestrian groups, not the whole population) while frequency/severity/persistence/equity are HIGH: physical barriers to independent movement are encountered routinely by the affected population, materially restrict autonomy, have been documented across multiple planning cycles since at least 2022, and fall specifically on people with disabilities and other vulnerable pedestrian groups, making equity a central rather than incidental dimension. This integrates the WU017 project-owner baseline in full; no deviation from the handoff's structure_action/triage/gate values. No PRB-0003 structure_action or validation_status change."
