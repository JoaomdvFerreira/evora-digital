notes: "RS-02A update (2026-08-12): direct verification of SRC-0101 (2022 report) and SRC-0102 (2023 report) confirms both contain, in wording identical to the current 2026 report (SRC-0018), the statement that the network covers practically all urban Évora daytime but reduces response at night, weekends and holidays — integrated as EVD-000117 (contribution CONFIRMS, temporal_relevance HISTORICAL, shared lineage_id MOB-2022-2023-CME-TRANSPORT-AUTHORITY-HISTORICAL-REPORTS, explicitly same institutional-voice family as the existing MOB-2026-07-CME-TRANSPORT-AUTHORITY-ANNUAL-REPORT lineage — evidence_confidence.independence is NOT increased by this addition and remains MEDIUM, since this is corroboration from the same institutional report series across years, not a new independent voice). civic_importance.persistence is revised MEDIUM -> HIGH: the temporal service-gap pattern is now documented across at least three annual editions (2022, 2023, 2026) of the same official report, materially stronger persistence evidence than the prior single-year (2026-only) basis for MEDIUM. No other civic_importance dimension changes (reach/severity remain MEDIUM, frequency/equity remain UNKNOWN — this addition speaks only to how long the pattern has existed, not to its breadth, severity or equity distribution). journey_understanding remains PARTIAL and decision_gates.journey_understood remains PARTIAL: this is historical persistence corroboration, not current line/corridor-level severity data, and does not by itself resolve U1. Two other RS-01-flagged desk angles were checked and explicitly NOT canonicalized as new findings: TREVO's public network-and-schedules page (trevo.com.pt/network-and-schedules) was inspected but returned only a client-rendered page shell with no extractable line/time-period schedule detail, so no new EVD was created — SRC-0021 (already canonical) stands unchanged; and Évora's flexible (taxi-based) transport initiative was reviewed only as further context for the already-canonical EVD-000024 EXISTING-SOLUTION finding, not as evidence about specific TREVO route/frequency deficits, per RS-02A's explicit evidence-discipline instruction. No PRB-0001 structure_action or validation_status change; triage remains DEEPEN. Evidence base (WU017 baseline, preserved): 9/9 linked EVD annotated (per WU017 project-owner handoff). Independence: five effective evidentiary threads across nine records, not nine independent ones. EVD-000002/EVD-000023/EVD-000024 share one lineage (SRC-0018, the 2026 municipal Relatório Anual de Atividade da Autoridade de Transportes) and were annotated under a shared lineage_id (MOB-2026-07-CME-TRANSPORT-AUTHORITY-ANNUAL-REPORT); EVD-000027/EVD-000028 join EVD-000011's existing lineage_id (MOB-2026-03-CIMAC-TPAC-ANNUAL-EVALUATION, SRC-0019, shared with PRB-0002 per its own prior annotation, unchanged here) because all three draw on the same CIMAC Avaliação Anual document. EVD-000001 (SRC-0002, PDS 2024-2027) is a genuinely distinct institutional-planning thread. EVD-000079 (JN report on the March 2026 Colégio Pedro da Fonseca student protest, SRC-0066) and EVD-000080 (Portal da Queixa TREVO complaint surface, SRC-0067) are the two independent lived-experience threads and are the only records giving concrete, if unverified, journey-level failure detail; both are already annotated (EVD-000080 pre-existing from D2-A, extended here only by confirming no change was warranted) and both remain representativeness UNKNOWN. Net: 5 effective threads (SRC-0002; SRC-0018 x3; SRC-0019 x3; SRC-0066; SRC-0067) across 9 linked records, which is why evidence_confidence.independence is MEDIUM rather than HIGH despite full linked-set coverage. EVD-000024 additionally carries an EXISTING-SOLUTION signal (taxi-based flexible transport already operating since 2023 for named low-demand locations), which must not be read as proof the practical-journey gap is closed for evenings/weekends/holidays or commuting/school journeys. civic_importance dimensions are derived independently of the handoff's gate/triage content, per the framework's separation of Évora Digital project posture (triage) from civic importance: reach/severity/persistence are MEDIUM because the corpus documents a real, recurring practical-service concern for identifiable but bounded populations (students, low-demand-location residents, evening/weekend/holiday users) without municipality-wide prevalence data; frequency and equity are UNKNOWN because no record quantifies how often failures occur or whether they fall disproportionately on any group. This integrates the WU017 project-owner baseline in full; no deviation from the handoff's structure_action/triage/gate values. No PRB-0001 structure_action or validation_status change."
