problem_id: PRB-0007
title: "Informal caregivers face fragmented information and support navigation needs"
domain:
  - "SOC"
  - "HEA"
geography:
  level: municipality
  area: "Município de Évora"
affected_populations:
  - "informal caregivers"
  - "cared-for people"
problem_statement: "Informal caregivers in Évora have documented information needs spanning health, mobility, support structures and financial/social support, and a substantial share of cared-for people receive no formal support service, despite Évora having a dense interinstitutional social-support network (CLASE / Rede Social)."
current_journey: null
reported_consequences: []
possible_root_causes:
  - "Évora already has a dense social-support institutional network (roughly 120 CLASE-listed institutions), so the problem should not be assumed to be 'no organisations exist'; coordination, capacity, discoverability and eligibility/navigation need separate investigation (per WU-D1-03 Batch A interpretation, not yet validated)."
  - "Existing services and user journeys must be mapped before any solution hypothesis, per the approved Round A cross-domain synthesis; this is not converted into a generic cross-domain 'information fragmentation' problem shared with other domains."
  - "Mental-health support capacity is a related but distinct institutional concern (see EVD-000035, freshness caution pending) and is intentionally not merged into this problem; it remains open investigation rather than a canonical problem until current evidence is sufficient under the recording-protocol rules for problem creation. WU-D1-03 Batch B (EVD-000046) further weakens a broad mental-health-capacity claim, since ULSAC operates active psychiatry and community mental-health responses; this confirms the decision to keep mental-health capacity as evidence/validation-only rather than a canonical problem."
  - "WU-D1-03 Batch B strengthens this problem with current-state evidence: the Municipality reports 262 people with official informal-caregiver status (January 2026) and is actively implementing a 2026-2027 caregiver plan (manual, systematisation of responses, simplified procedures, digital publication) that explicitly targets the information/navigation friction this problem describes (see EVD-000044). ULSAC and local partners already operate caregiver-oriented services (UCC, Cantinho do Cuidador, VIVAMENTE), confirming the remaining gap is navigation/coordination/awareness rather than absence of service (see EVD-000045). Institutional confidence: HIGH. Current-state confidence: HIGH."
  - "D2-B Round A (WU-D2-03) strengthens the information/rights-navigation component with direct caregiver-derived evidence from a 133-caregiver questionnaire and focus groups within the same Plano Concelhio dos Cuidadores Informais lineage as EVD-000034/EVD-000044 (same SRC-0030 source; not an independent corroborating source; sample recruited via caregiver-support organisations and geographically concentrated, so representativeness is LIMITED / not population-representative — see EVD-000089). Caregiver focus-group material explicitly names bureaucracy and difficulty understanding rights as a distinct friction (EVD-000091), and caregivers themselves proposed centralised, simplified, multi-channel information access that the plan's 2026-2027 actions are already designed to address (EVD-000092). D2-B also constrains the problem: reported needs prioritise support in care (~40.8%), respite (~40.0%), financial support (~36.8%) and psychological support (~31.2%) above navigation-adjacent needs (EVD-000090), so PRB-0007 must not be reduced to an information-discovery problem — respite, direct-care capacity, financial and psychological support are major, often lower-digital-leverage needs outside this problem's navigation/coordination scope. Broad open-web caregiver public-signal discovery is treated as near-saturated for D2 (caregiving is privacy-sensitive and underrepresented in open channels; sparse public signal is a channel limitation, not evidence the problem is weak or absent). Remaining questions — awareness of Cantinho do Cuidador, whether the 2026-2027 manual/systematisation actions are delivered and effective, repeat-storytelling/documentation burden across institutions, and urban/rural barrier differences — are carried forward to D5 stakeholder validation rather than resolved here. validation_status remains unvalidated; no new PRB-*/HYP-* created."
