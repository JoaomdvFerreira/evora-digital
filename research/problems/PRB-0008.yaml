possible_root_causes:
  - "Possible components include visibility of skills demand, training adaptation, employer/education feedback loops, and inclusive employment for vulnerable groups (per WU-D1-04 Batch A interpretation, not yet validated). Do not assume a job-board solution."
  - "Existing infrastructure (industrial/technology parks, incubation, aerospace-sector facilities, employability/training measures, UÉ labour-market integration work) means this is not an 'absence of institutional response' problem; infrastructure existence does not prove SMEs or workers can easily discover or navigate support opportunities. Batch B must determine current employer-reported shortages and SME navigation experience."
  - "Repeated claims across SRC-0002 and SRC-0028 share the same PDS/Rede Social institutional lineage and are not independent corroboration; UÉ's own planning (SRC-0010) provides a second, distinct institutional line on education-to-employment work."
