problem_statement: "Road-surface degradation and road-maintenance reliability are a current municipality-level civic problem. A January 2026 petition reported widespread potholes/degraded pavement and safety/vehicle-damage impacts; the Municipality subsequently acknowledged a material maintenance/requalification need and a roughly €1.5M repair response; a later location-specific public signal alleged continued persistence at the N114 entrance to Évora. The later social signal is unverified and the available evidence must not be read as a municipality-wide prevalence estimate."
