problem_statement: "A degradação do pavimento rodoviário e a fiabilidade da manutenção das vias constituem um problema cívico atual ao nível do município. Uma petição de janeiro de 2026 relatou a existência generalizada de buracos e pavimento degradado, bem como impactos na segurança e danos nos veículos; posteriormente, o Município reconheceu uma necessidade significativa de manutenção/requalificação e uma resposta de reparação na ordem dos 1,5 milhões de euros; um sinal público posterior, relativo a uma localização específica, alegou que o problema persistia na entrada da N114 em Évora. Esse sinal posterior, de natureza social/comunitária, não está verificado, e a evidência disponível não deve ser interpretada como uma estimativa da prevalência em todo o município."
