possible_root_causes:
  - "WU-D3-03 promotion (docs/milestones/D3-WU03-structure-review.md): promoted from the D2 road-surface-maintenance NEW-CANDIDATE (retained unlinked through D2 closure and the WU-D3-02 pilot) to this canonical PRB, per project-owner decision. The preserved evidence supports a distinct failure mechanism — physical road-surface degradation/potholes, maintenance/requalification service reliability, road-condition safety/vehicle-damage/mobility effects, and municipal acknowledgement and repair response — materially different from PRB-0005's traffic/parking-pressure-versus-pedestrian/public-space mechanism. Digital leverage over the core physical mechanism is expected to be low, but low digital leverage is not a reason to deny the existence of a civic problem. current_journey is deliberately left null; no user journey was manufactured for this promotion. No ASM-0010 created in WU-D3-03 — this problem becomes eligible for assessment in WU-D3-04."
