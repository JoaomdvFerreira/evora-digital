notes: "RS-02B2. Directly verified by PDF text inspection 2026-08-12. July 2021 CAPP/ISCSP research report on caregivers of older people in Portugal. It reports 400 questionnaire respondents distributed across NUTS II, including 27 in Alentejo, but explicitly uses non-probability convenience sampling and states that findings cannot be generalised to the study population/universe. It is therefore broader Portuguese contextual evidence only: not statistically representative prevalence and not Évora-specific evidence."
