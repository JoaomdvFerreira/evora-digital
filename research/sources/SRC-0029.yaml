notes: "WU-D1-03 Batch A (provisional D1-03-A-S03). Growth in overcrowding/degradation indicators in parts of the housing stock; more than 200 local-accommodation units with capacity above 1,800 beds, concentrated especially in the Historic Centre; public student-residence capacity described as insufficient relative to displaced/international student demand; purchase-market prices show generalized growth; housing dynamics differ materially by part of the city. Freshness caution: much of the quantitative base uses Census 2021/earlier series - use as institutional diagnosis, not automatically as a 2026 measurement (freshness status recorded as STALE for that reason)."
