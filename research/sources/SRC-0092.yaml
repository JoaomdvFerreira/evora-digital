notes: "Via Verde Estacionar's product pages describe a 'Parking Buddy' feature (map-based destination search, green/yellow/red probability of finding street/private parking, updates approximately every 30 minutes, prediction based on Via Verde historical parking data plus external factors such as weather and sporting/cultural events, forecasts up to 48 hours ahead) and list Évora among the municipalities where its street-parking payment service is available. This review did not independently verify Parking Buddy's coverage or accuracy for specific Évora zones — see EVD-000105."
