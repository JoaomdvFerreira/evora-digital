notes: "CIMAC maintains a normalized geographic information database for Alentejo Central. Earlier canonical reference (still relevant): https://www.cimac.pt/cimac/info-a-tratar/unidade-de-ambiente-e-desenvolvimento/cartografia-e-sistemas-de-informacao-geografica/ - that descriptive page is dated 2020 and notes older cartography-update dates for some layers; dataset-level freshness must be checked individually before reuse. Batch B update: the GEOCIMAC page, current in 2026, describes ArcGIS Pro, ArcGIS Enterprise/Portal for ArcGIS, map services, WebGIS applications, and creation/management/update of intermunicipal geographic information, with an explicit objective of making territorial information more accessible and reusable by citizens, academia and businesses. The infrastructure gap is not that Évora lacks GIS; the remaining discovery question is developer-facing service discovery, metadata, layer freshness, licence clarity and convenient reuse."
