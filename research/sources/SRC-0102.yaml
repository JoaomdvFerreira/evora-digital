notes: "RS-02A. Prior-year edition of the same municipal transport-authority annual report series as SRC-0018 (2026 edition) and SRC-0101 (2022 edition). Verified by direct fetch/text extraction 2026-08-12: contains the identical statement 'A rede abrange praticamente a totalidade do território urbano de Évora em período diurno, reduzindo a resposta em horários noturnos e fins de semana e feriados' found in both the 2022 and 2026 reports, plus per-line (carreira) frequency tables split by weekday/Saturday/Sunday-holiday (marks 2021 figures as provisional). status STALE — superseded by SRC-0018 for current-state purposes; retained only as historical corroboration of a multi-year pattern, not as current operational data."
