notes: "Current intermunicipal operational evidence: user communications, public-information deficiencies, satisfaction survey, and confirmation that TPAC network data was converted to GTFS in 2025. Availability and reuse conditions of the GTFS feed require direct verification with CIMAC/ATAC. Batch B update: a bounded public-source review did not locate a direct public GTFS download endpoint or explicit GTFS reuse licence; this must not be converted into a claim that no public endpoint exists. Public-information deficiencies persisted in 2025 (absent/outdated network maps, schedules and line identification at multiple stops/terminals; some digital concessionaire content incomplete or outdated), and the waiting/information experience remained weaker than the in-vehicle experience."
