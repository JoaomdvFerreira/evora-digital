notes: "RS-02B1. Verified by direct download/text extraction 2026-08-12 (HTTP redirect confirmed the file's last-modified date as 2020-12-10). Article on 'Formato e suporte de fornecimento da informação' states: 'Os formatos de cedência de informação são: dwg; shp; ecw e pdf.' This establishes that the Municipality is capable of supplying structured geospatial data (including SHP/shapefile) on request, but the regulation describes a formal cedência (case-by-case transfer) process, not an open/self-service machine-readable dataset or API. The regulation is general-purpose (any municipal digital cartography, including but not limited to cycling infrastructure) and does not itself confirm that a cycling-network layer specifically has been requested, supplied, or kept current."
