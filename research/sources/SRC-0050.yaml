notes: "WU-D1-05 Batch B (provisional D1-05-B-S03). Current-State Challenge evidence: the municipal portal currently links directly to this operational associativism platform, and separate municipal associativism pages use the same platform for documents/calls (2025 support-call references). Directly resolves Batch A's uncertainty about the implementation status of PECE's (SRC-0043) 'Portal do Associativismo' proposal (D1-05-A-E03/P02): a dedicated platform already exists and is materially implemented, so the old strategic proposal should NOT be recorded as an unimplemented digital gap. Whether cultural/associative actors experience friction inside this existing workflow is unresolved and carried forward as a next research question (see EVD-000060)."
