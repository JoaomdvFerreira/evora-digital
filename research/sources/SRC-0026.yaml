notes: "In June 2026 the Municipality moved the 4th PUE revision into an 'Experimental Actions' phase, inviting residents/entities to select and physically test pedestrian/soft-mobility routes and contribute perceptions and proposals for a more inclusive, accessible and sustainable city. This is current formal participatory activity, not a completed study; participant outputs require separate assessment before being treated as evidence."
