notes: "North Norfolk publishes a list of locations not collected on a given round, so residents in an already-known affected area are not required to submit an individual report. Selected as the single proactive-disruption-communication comparator (Mechanism A) out of several near-identical UK council examples reviewed (e.g. West Lancashire, West Lothian) — the others were not separately canonicalized because they describe the same operating pattern; see EVD-000110 and docs/milestones/D4-WU02-PRB0009-progress.md §3.3 for the selection rationale."
