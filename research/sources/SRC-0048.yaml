notes: "WU-D1-05 Batch B (provisional D1-05-B-S01). Current-State Challenge evidence: the 2026 municipal agenda includes a structured event-submission workflow with fields for category/subcategory, dates/times, target audience, language, location, mobility-reduced accessibility, communication accessibility, registration, price, organiser/contact, and links/social channels. Directly weakens Batch A's provisional concern that event/accessibility metadata might be absent (D1-05-A-P01/E01) — see EVD-000058/EVD-000059. Public machine-readability of this dataset (e.g. feed/API) is unresolved and carried forward as an open question, not assumed."
