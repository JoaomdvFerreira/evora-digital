notes: "WU-D1-06 Batch B (provisional D1-06-B-S01). Municipality publicly acknowledged urban solid waste (RSU) collection disruptions in February 2026; stated cause was breakdown of a large part of the ageing municipal collection fleet; at the most constrained point only one vehicle was operational; additional vehicles and procurement of four new collection vehicles were announced."
