notes: "WU-D1-05 Batch A (provisional D1-05-A-S01), merged with Batch B's D1-05-B-S04 (same document/URL, accessibility-mapping actions — not a separate source). Distinct document from SRC-0002 (PDS 2024-2027); PECE is Évora's dedicated cultural strategy, not the general social-development plan. Key findings: cultural-ecosystem growth/cooperation/capacity; diversified and inclusive cultural offer; accessibility and participation as explicit policy concerns, including a call for accessibility mapping of cultural facilities and accessible cultural content; monitoring and communication; tourist-cultural offer structuring; a need for shared-information/coordination mechanisms between the Municipality and cultural/creative-ecosystem actors, including a 'Portal do Associativismo' concept. Implementation status of the coordination/portal proposal is checked in Batch B (see SRC-0050, EVD-000060)."
