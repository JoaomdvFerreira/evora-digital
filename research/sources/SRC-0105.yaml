notes: "RS-02B1. Verified by direct fetch 2026-08-12 (article:published_time meta tag confirms 2025-03-21). Primarily a road-pavement-maintenance announcement (a €200,000 cold-microaggregate pavement-repair contract, plus an extended intervention near Bairro de Santa Luzia), but also states that a completed first phase of a pedestrian/cycling connection between Bairro de Nª Srª da Saúde and the ponte do Xarrama (€90,000 investment) is done, and a second phase of that same connection (onward to Bairro de Santa Luzia) is being prepared, pending a stormwater-drainage infrastructure project. Framed explicitly as practical implementation of PMUSE. status STALE because this describes a March 2025 snapshot of an in-progress, multi-phase connection, not necessarily its August 2026 completion state."
