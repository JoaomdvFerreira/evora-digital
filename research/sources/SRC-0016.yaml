notes: "Strategic municipal mobility plan (final strategy and proposals). Includes pedestrian/accessibility policy, parking, public transport, cycling, intermodality, smart parking proposals, and the requirement to revisit the municipal accessibility plan. The plan includes proposals; proposed measures must not be recorded as if already implemented. Batch B update: confirms that the Local Accessibility Promotion Plan R.A.M.P.A.-Évora was prepared in 2022, covering the Historic Centre plus major access/exit axes, and should later be revisited to monitor implementation and expand coverage; also explicitly proposed a smart-parking system using sensors/management and real-time information. These are planning proposals and must not be confused with current implementation status. No public R.A.M.P.A. structured dataset was located in this bounded review; reuse licence UNKNOWN."
