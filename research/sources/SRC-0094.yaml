notes: "SFMTA's official evaluation of the SFpark pilot, which bundled occupancy sensing, real-time availability information, demand-responsive pricing, and meter/payment changes in pilot areas versus untouched control areas. Used in WU-D4-01 as comparative outcome evidence for PRB-0005, not as Évora-specific evidence — see EVD-000107. The bundled design means the reported outcomes cannot be attributed to information/data publication alone."
