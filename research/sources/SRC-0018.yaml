notes: "Current operational evidence for Évora's urban bus network: service coverage, Linha Azul, flexible transport, punctuality, complaints and public information. Batch C update: 2025 operational figures confirm 876,148 passengers (up 90,522 versus 2024, still 1.9% below pre-pandemic levels), daytime coverage of practically all urban Évora with reduced night/weekend/holiday response, taxi-based flexible transport for Chainha Berlim, Santo Antónico, Barraca de Pau and Garraia, 11 urban routes plus 2 LinhAzul routes, 99.5% service regularity, 84.4% IP-5 minute punctuality (delays attributed by the Municipality to congestion on principal routes to the Historic Centre and the Industrial Park circular), the TREVO website described by the Municipality as providing complete timetable/route/passenger information, and that E-BUS did not provide 2025 satisfaction-survey results to the Municipality."
