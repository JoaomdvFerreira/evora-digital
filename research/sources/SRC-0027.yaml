notes: "Stakeholder/data-owner map only; these contacts are not to be used automatically during D1. Identifies Divisão de Ambiente e Mobilidade (DAM) as the municipal mobility/environment operational owner (phone +351 266 777 154, email `cme.dam@cm-evora.pt`) and Divisão de Ordenamento e Reabilitação Urbana (DORU) as the urban planning/requalification owner relevant to PUE and physical urban interventions (phone +351 266 777 027, email `cme.doru@cm-evora.pt`). General municipal contact page: https://www.cm-evora.pt/municipe/camara-municipal/recursos-humanos/contatos/. General municipal contact remains available for routing formal requests."
