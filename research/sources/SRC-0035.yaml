notes: "WU-D1-03 Batch B (provisional D1-03-B-S01). Agreement confirms EUR67.1M for construction/rehabilitation of 459 homes; 40 homes planned in Bairro do Moinho for affordable rent; 122 new homes planned in Bairro do Escurinho; temporary/transitional accommodation centre with minimum capacity for 24 people; Municipality states the programme is intended to benefit approximately 500 families. Confirms active, funded, current supply-side housing intervention distinct from the 2025 planning documents (SRC-0028/SRC-0029)."
