notes: "WU-D1-06 Batch A (provisional D1-06-A-S03) merged with Batch B (provisional D1-06-B-S03) - same URL. Urban hygiene is explicitly described by the Municipality as one of the main municipal-management challenges. Measures: selective door-to-door collection expanding after a pilot; three specialised external hygiene teams begin 1 August 2026; responsibilities decentralised to urban parish councils; bulky-waste collection reorganised (faster response, shift work, longer delivery/collection windows); an internal monitoring team created. The Municipality explicitly states difficulties remain in some areas."
