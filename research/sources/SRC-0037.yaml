notes: "WU-D1-03 Batch B (provisional D1-03-B-S03). Additional pages: https://www.sas.uevora.pt/Alojamento/ ; https://www.uevora.pt/estudar/estudantes-ue/Alojamento/Outras-Opcoes-de-Alojamento. UÉ states seven residences have nominal capacity for 525 students; PRR investments expected to add 105 beds, reaching approximately 630; three residences were closed for renovation during 2025/2026 (temporary capacity disruption); UÉ explicitly points students toward private/alternative accommodation due to limited places. New publisher not previously canonical in this repository; supersedes the older, Census-2021-era student-residence figures cited only qualitatively in SRC-0029."
