notes: "WU-D1-03 Batch A (provisional D1-03-A-S04). Caregiver information needs include mobility, falls, disease, death, support structures, social/financial/health support, work-life balance and recognition. The underlying study interviewed 68 caregivers and 89 cared-for people; 35% of respondents reported the cared-for person used no support service. WU-D1-03 Batch B update (provisional D1-03-B-S04): the successor Plano Concelhio dos Cuidadores Informais 2026-2027 is now in implementation; the Municipality reported 262 people with official informal-caregiver status in the municipality as of January 2026; the plan includes creation of a caregiver manual, systematisation of existing responses, simplification of procedures, digital publication and reminders/communications. This is institutional self-recognition of the information/navigation friction identified in Batch A, materially strengthening PRB-0007."
