notes: "WU-D1-04 Batch A (provisional D1-04-A-S04). Reports 1,193 of 1,371 first-phase national-access places filled in 2025 (87%); UÉ reports relatively strong attraction during a national decline; the new Aerospace Engineering course filled all first-phase places. Interpretation: the first institutional problem is not necessarily attraction to higher education - retention and local transition after study are separate questions."
