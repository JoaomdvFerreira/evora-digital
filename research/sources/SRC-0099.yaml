notes: "RS-02A. EURES' Portugal labour-market information page names recruitment-need/shortage occupations for the Alentejo region: agronomists; software programmers; repairers and agricultural machinery operators; seasonal agricultural workers (fruit harvesting, March-October); electromechanical/electrical maintenance technicians; chefs; meat cutters; construction workers. Scope is explicitly the Alentejo administrative region as a whole ('more than a third of the national territory, but only 4.5% of the Portuguese population'), not the Évora municipality specifically; the page does not isolate municipality-level data. Verified by direct fetch 2026-08-12."
