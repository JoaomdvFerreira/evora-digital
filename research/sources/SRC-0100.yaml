notes: "RS-02A. IEFP's national monthly Centros de Emprego (Employment Centre) statistics bulletin, April 2025 edition. Verified by direct fetch/text extraction 2026-08-12. The Delegação Regional do Alentejo table confirms CTEF Évora's territorial catchment spans fourteen municípios (Alandroal, Arraiolos, Borba, Estremoz, Évora, Montemor-o-Novo, Mora, Mourão, Portel, Redondo, Reguengos de Monsaraz, Vendas Novas, Viana do Alentejo, Vila Viçosa), not the Évora municipality alone. The document reports desemprego/oferta/colocação aggregate figures per employment-centre catchment; it does not publish an occupation-level shortage/hard-to-fill list at any geography. status STALE because this is a monthly-periodicity bulletin and a more recent monthly edition likely exists but was not sought (out of RS-02A's bounded scope)."
