observation:
  summary: "O relatório municipal de 2026 afirma que a rede cobre praticamente toda a zona urbana de Évora durante o dia, mas reduz a oferta de serviço à noite, aos fins de semana e nos feriados. Várias localidades de baixa procura que deixaram de ser servidas por linhas fixas em 2023 (Chainha Berlim, Santo Antónico, Barraca de Pau, Garraia) são servidas através de transporte público flexível baseado em táxi."
