observation:
  summary: "The 2026 municipal report states that the network covers practically all urban Évora during daytime but reduces its response at night, weekends and holidays. Several low-demand locations removed from fixed routes in 2023 (Chainha Berlim, Santo Antónico, Barraca de Pau, Garraia) are served through taxi-based flexible public transport."
evidence_nature: fact
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "PRB-0001 should not be framed as general lack of urban geographic coverage. The current institutional gap is more accurately temporal/service-pattern adequacy plus the practicality of flexible coverage for low-demand locations."
