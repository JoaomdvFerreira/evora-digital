observation:
  summary: "SFMTA's official SFpark pilot evaluation reported search time down 43% in pilot areas versus 13% in control areas, blocks 'too full' 16% less often in pilot areas (versus +51% in controls), and parking-search vehicle-miles/greenhouse-gas emissions down 30% in pilot areas versus 6% in controls."
