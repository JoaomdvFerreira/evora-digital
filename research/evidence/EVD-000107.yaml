notes: "Comparator/mechanism evidence, not Évora-specific. The pilot bundled occupancy sensing, real-time availability information, demand-responsive pricing, and meter/payment changes, so the reported outcomes cannot be attributed to information/data publication alone. Do not cite as evidence that exposing occupancy data by itself would produce similar results in Évora; if PRB-0005's underlying issue is scarcity/high occupancy, information alone may only redistribute search behaviour (WU-D4-01 Model B)."

