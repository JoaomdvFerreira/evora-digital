observation:
  summary: "The 2026 municipal transport-authority report states that the urban network covers practically all urban Évora during daytime but reduces service at night, weekends and holidays. Since 2023, several low-demand locations have been moved from fixed-route service into taxi-based flexible public transport. The urban network comprises 11 regular urban lines plus two Linha Azul routes."
