observation:
  summary: "O relatório de 2026 da autoridade municipal de transportes afirma que a rede urbana cobre praticamente toda a zona urbana de Évora durante o dia, mas reduz a oferta de serviço à noite, aos fins de semana e nos feriados. Desde 2023, várias localidades de baixa procura passaram do serviço de linhas fixas para transporte público flexível baseado em táxi. A rede urbana é composta por 11 linhas urbanas regulares e duas linhas da Linha Azul."
