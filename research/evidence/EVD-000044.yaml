observation:
  summary: "O problema de informação e orientação dos cuidadores é explicitamente reconhecido pelas próprias instituições: o Município referiu 262 pessoas com estatuto oficial de cuidador informal em janeiro de 2026 (comunicado através da CLASE), e o programa para 2026-2027 prevê sistematizar as respostas existentes, simplificar procedimentos, elaborar um manual do cuidador, publicá-lo em formato digital e disponibilizar lembretes e atualizações. Isto reforça de forma significativa o problema candidato da Ronda A segundo o qual os cuidadores enfrentam dificuldades no acesso à informação e na orientação entre apoios."
