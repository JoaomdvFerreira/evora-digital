notes: "D5-OP-003 (WU022) response, received 2026-08-12 via direct institutional outreach. Respondent role-labelled only (APCE technical project coordinator, occupational therapist) — no personal name, email, or raw correspondence retained in this repository, per docs/discovery/research-ethics.md §11. Governance/methodology fact about APCE's own operating practice (why CME co-partners, and how in-loco assessment works) — strength primary-authoritative is used specifically for this operational fact APCE owns as the assessing actor, per docs/models/evidence-model.md's D5 rule; it does not extend to prevalence/coverage claims about residents. CONFIRMS/REFINES the participatory basis already partially documented in EVD-000085 (Acesso Universal 1.3, a distinct earlier lineage), now with an explicit governance rationale (public space = municipal competence) that was not previously canonicalized. Shares analysis.lineage_id D5-ENG-OP-003 with EVD-000113 and EVD-000114 (same engagement); do not treat this trio as independent corroboration of each other or of the separate ACC-2025-APCE-ACESSO-UNIVERSAL-1.3 lineage (EVD-000085/086/104) — same institutional voice (APCE) across both lineages."

