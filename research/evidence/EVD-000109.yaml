observation:
  summary: "Oxford City Council states that resident missed-bin reports are checked against a live reporting system fitted in collection vehicles, distinguishing a genuine missed collection from an issue already recorded by the crew, or another reason for non-collection — resident-facing reporting is integrated with operational collection data rather than forming a separate unverified complaint queue."
