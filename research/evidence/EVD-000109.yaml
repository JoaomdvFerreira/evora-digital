notes: "Comparator/mechanism evidence, not Évora-specific. Describes an operating pattern (request/operations integration), not measured outcome effect. If Évora's occurrence platform is not connected to collection-operation data, the relevant residual gap may be integration/routing rather than another front-end reporting tool — this must be verified with the municipal operator (D5-P9-02), not assumed (WU-D4-02 Mechanism B)."

