  retained: false
notes: "D5-OP-003 (WU022) response, received 2026-08-12. Distinct programme from Acesso Universal 1.3 (municipal public space / cultural facilities, lineage ACC-2025-APCE-ACESSO-UNIVERSAL-1.3, EVD-000085/086/104): this one targets private commercial premises (shops) in the Historic Centre and uses a graded-seal continuous-improvement mechanism rather than a location-by-location municipal inventory — a second, EXISTING-SOLUTION track for PRB-0003, not a duplicate of the municipal-facilities work. Shares analysis.lineage_id D5-ENG-OP-003 with EVD-000112 and EVD-000113 (same engagement). NERE triangulation note: this is the first corpus record connecting NERE to accessibility/PRB-0003 — all prior NERE-referencing records (EVD-000048, EVD-000051, EVD-000101/102, ASM-0008) concern PRB-0008 (employment/skills alignment) and are unrelated in domain. This finding is reported by APCE only and must not be read as NERE confirming or describing its own role; NERE's D5-OP-006 outreach (docs/milestones/D5-WU01-operator-challenge-progress.md) remains SENT/pending response. No coverage, uptake, or effectiveness data for the seal programme was provided — do not treat this as evidence that the seals measurably improve shop accessibility, only that the programme exists and is ongoing."

