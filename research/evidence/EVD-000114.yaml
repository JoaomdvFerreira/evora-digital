observation:
  summary: "A APCE refere um programa distinto e em curso para a acessibilidade dos estabelecimentos comerciais no Centro Histórico de Évora, desenvolvido inicialmente com a Associação Comercial e posteriormente continuado com o NERE, utilizando selos que representam o nível de acessibilidade de cada estabelecimento no âmbito de uma abordagem de melhoria contínua. A APCE afirma que a atividade começou como projeto e continua como trabalho em curso, em vez de constituir uma iniciativa pontual já concluída. Esta é a descrição da própria APCE sobre o envolvimento do NERE; não constitui confirmação por parte do NERE, cuja resposta ao contacto D5 (D5-OP-006) continua pendente."
