observation:
  summary: "No questionário a 133 cuidadores, as necessidades referidas deram prioridade ao apoio na prestação de cuidados (aprox. 40,8 %), ao descanso do cuidador (aprox. 40,0 %), ao apoio financeiro (aprox. 36,8 %) e ao apoio psicológico (aprox. 31,2 %), com valores superiores aos de várias necessidades relacionadas com orientação; quando lhes foi pedido que indicassem uma única necessidade mais importante, o descanso do cuidador e o apoio na prestação de cuidados foram os mais destacados."
evidence_nature: measurement
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "D2-B Round A (D2-B-SIG-02). REFINES PRB-0007; LOW-DIGITAL-LEVERAGE for the highest-ranked needs. Establishes that PRB-0007 must not be reduced to 'information is hard to find' — capacity, respite, direct support and financial/psychological needs are reported as more consequential than pure navigation friction and are not converted into a digital-navigation problem. Same SRC-0030 lineage as EVD-000089; not an independent corroborating source."

