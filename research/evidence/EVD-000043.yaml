observation:
  summary: "Student accommodation capacity is improving (525 nominal capacity across seven residences, plus 105 PRR-funded beds expected, reaching approximately 630) but remains constrained: three residences were closed for renovation during 2025/2026 (temporary capacity disruption), and UÉ explicitly redirects students toward private/alternative accommodation due to limited places. Student housing remains a supported subproblem within the housing cluster; exact unmet demand in 2026 is not quantified by the reviewed public sources."
