observation:
  summary: "A capacidade de alojamento estudantil está a melhorar: a capacidade nominal é de 525 lugares em sete residências, prevendo-se mais 105 camas financiadas pelo PRR, para um total aproximado de 630. Ainda assim, a capacidade mantém-se limitada: três residências estiveram encerradas para obras durante 2025/2026, provocando uma perturbação temporária da capacidade, e a UÉ encaminha explicitamente os estudantes para alojamento privado ou alternativo devido à limitação de vagas. O alojamento estudantil continua a ser um subproblema sustentado pela evidência no âmbito do conjunto de problemas habitacionais; a dimensão exata da procura não satisfeita em 2026 não é quantificada pelas fontes públicas analisadas."
