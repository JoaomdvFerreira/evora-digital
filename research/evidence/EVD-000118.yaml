observation:
  summary: "O Volume I do PMUSE contém cartografia municipal oficial da rede ciclável existente (Figura 73), distinguindo infraestrutura exclusivamente ciclável (~8,5 km distribuídos por quatro segmentos, Figura 74) de percursos partilhados por peões e ciclistas (~120 km, na sua maioria os recreativos Percursos de Monfurado e Ecopista do Ramal de Mora), bem como um mapa da tipologia da rede (Figura 78). O texto que acompanha as figuras reitera que a rede atual tem extensão reduzida e é espacialmente descontínua, não assegurando ligação à maioria dos equipamentos, serviços e zonas residenciais relevantes. As três figuras têm a legenda «Fonte: Câmara Municipal de Évora, 2020», apesar da data de publicação do relatório, 2025-09."
evidence_nature: fact
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "RS-02B1 (docs/discovery/rs-01-evidence-gap-review.md Gap 7). Establishes that official municipal cycling-network cartography publicly exists (a materially stronger finding than the prior bounded audit in ASM-0004, which located only the non-authoritative ciclovia.pt inventory). Does NOT establish that a current, machine-readable, publicly downloadable/reusable dataset exists — this is a plan-document figure, not a confirmed open-data layer, and its own source citation dates the underlying cartography to 2020. Reinforces, rather than newly establishes, EVD-000005's discontinuity finding (same underlying diagnosis, both institutional-planning voice)."

