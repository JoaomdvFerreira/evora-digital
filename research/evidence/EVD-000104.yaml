observation:
  summary: "A APCE e a Câmara Municipal de Évora comunicam que, na sequência da verificação de equipamentos culturais geridos pelo município, produziram conjuntamente um levantamento que identifica condições de acessibilidade existentes, condições de acessibilidade em falta e possíveis soluções de melhoria para o conjunto de equipamentos avaliado. O texto público não enumera os equipamentos específicos nem as barreiras específicas em formato legível por máquina ou em forma textual detalhada, nem estabelece que cada défice identificado ainda estivesse presente em agosto de 2026."
