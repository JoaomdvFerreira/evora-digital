notes: "WU018 (WU-D3-05). Materially stronger than EVD-000086 (October 2025, 'verification continuing' claim only): this record reports a completed joint inventory result, not merely an ongoing process. Same Acesso Universal 1.3 programme lineage as EVD-000085 (SRC-0073) and EVD-000086 (SRC-0074) — assigned lineage_id ACC-2025-APCE-ACESSO-UNIVERSAL-1.3, also retrofitted onto EVD-000085/EVD-000086 for consistent independence accounting (see their own notes fields, unchanged otherwise). Do not count as independent corroboration of EVD-000085/EVD-000086 merely because it is a later publication — same publisher/programme, distinct primary source_id only. Does not claim barriers are fixed; does not claim city-wide prevalence."

