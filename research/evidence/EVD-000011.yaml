observation:
  summary: "O conjunto de dados de comunicações de 2023-2025 regista 92 comunicações relativas a horários, 52 relativas às condições dos veículos, 24 a atrasos, 8 a paragens e números inferiores relativos a passes, bilhética, sobrelotação e alterações de linhas. O relatório afirma que 43% das comunicações estavam relacionadas com horários e que muitas diziam respeito a pedidos para criar ou sincronizar horários, e não a incumprimentos do serviço. A sua avaliação de satisfação de 2025 conclui que a experiência a bordo é mais positiva do que a experiência de espera e de acesso à informação."
