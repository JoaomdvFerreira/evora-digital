observation:
  summary: "The 2023-2025 communication dataset records 92 communications concerning schedules, 52 vehicle conditions, 24 delays, 8 stops, and smaller numbers for passes, ticketing, overcrowding and route changes. The report states that 43% of communications were schedule-related and that many concerned requests to create or synchronize schedules rather than service non-compliance. Its 2025 satisfaction assessment concludes that the in-vehicle experience is stronger than the experience of waiting and accessing information."
