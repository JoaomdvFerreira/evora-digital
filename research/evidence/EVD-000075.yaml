observation:
  summary: "A comunicação de ocorrências já é uma solução existente suficientemente madura para rejeitar a duplicação: a plataforma municipal permite comunicar ocorrências através da web e de dispositivos móveis e acompanhá-las online até à conclusão. A questão não resolvida não é a existência, mas o desempenho (tempo até à primeira ação, tempo até à resolução, volume de pendências, encaminhamento e reatribuição, qualidade do encerramento e comunicações duplicadas); não foi localizado qualquer conjunto de dados público sobre estas métricas."
