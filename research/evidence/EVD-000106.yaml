observation:
  summary: "Uma experiência controlada em contexto real (274 sensores embutidos junto ao passeio a alimentar informação de disponibilidade em tempo real no sistema OpenPark; 11 condutores, 33 percursos, 495 entregas simuladas; com e sem informação de disponibilidade) concluiu que a apresentação de informação sobre disponibilidade junto ao passeio reduziu em 27,9 % o tempo de circulação à procura de estacionamento e em 12,4 % a distância percorrida nessa procura."
evidence_nature: measurement
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "Comparator/mechanism evidence, not Évora-specific. Strongest available evidence that availability information alone can reduce search behaviour where curb-availability uncertainty is causal. Transferability to PRB-0005 is limited: commercial delivery vans (not general passenger parking), a dense 10-block instrumented Seattle curb/loading context, drivers instructed not to double-park, and no demonstrated proportional reduction in total vehicle distance/emissions. Use as mechanism evidence only, not proof of an equivalent Évora effect (WU-D4-01 Model A)."

