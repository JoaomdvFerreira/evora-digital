observation:
  summary: "Os relatórios anuais de 2022 e 2023 da autoridade municipal de transportes afirmam ambos, com formulação idêntica à do relatório atual de 2026 (EVD-000002/EVD-000024), que a rede urbana cobre praticamente toda a zona urbana de Évora durante o dia, mas reduz a oferta de serviço à noite, aos fins de semana e nos feriados. Isto estabelece esse padrão temporal de redução do serviço como uma característica documentada da rede ao longo de vários anos (pelo menos de 2022 a 2026), e não como uma condição observada apenas recentemente ou transitória."
