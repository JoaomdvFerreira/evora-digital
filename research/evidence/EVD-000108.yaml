observation:
  summary: "Havant Borough Council's customer portal exposes collection status such as 'not started', 'closed-complete', rescheduled collection dates, and crew-logged problems, so a resident can report a missed bin only when the collection state makes that report valid — reducing ambiguity between 'the round has not reached me yet', 'the collection was completed but my bin was missed', 'the crew recorded a reason', and 'the collection was rescheduled'."
