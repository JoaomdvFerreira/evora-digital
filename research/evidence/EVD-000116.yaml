observation:
  summary: "O boletim estatístico mensal nacional dos centros de emprego do IEFP comunica valores de desemprego, vagas e colocações ao nível da área de abrangência do Centro de Emprego (CTEF). A área de abrangência do CTEF Évora cobre catorze municípios, e não apenas o concelho de Évora, e o boletim não publica, para nenhuma escala geográfica, uma lista discriminada por profissão que identifique situações de escassez ou profissões de difícil recrutamento."
evidence_nature: fact
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "RS-02A. Confirms and bounds a limitation flagged in docs/discovery/rs-01-evidence-gap-review.md (Gap 17): IEFP employment-centre statistics for the Évora catchment are useful labour-market activity context but cannot be read as an Évora-municipality-specific shortage-occupation source, because the territorial unit (CTEF Évora) is intermunicipal, not municipal. Does not itself confirm or refute any occupation as hard-to-fill."

