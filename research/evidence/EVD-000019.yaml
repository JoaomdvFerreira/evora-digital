observation:
  summary: "Em fevereiro de 2025, o Município comunicou que estavam em curso obras do PMUSE na interface do Rossio e na Variante/PITE, prevendo-se que acrescentassem cerca de 6 km de percursos pedonais/cicláveis na zona sul da cidade. Em 2026, a área do Rossio entrou numa requalificação adicional, em várias fases, dando explicitamente continuidade à anterior interface de mobilidade suave Estação/Rossio."
