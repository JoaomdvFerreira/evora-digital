  summary: "Caregivers themselves proposed centralised, simplified, multi-channel access to information — physical, virtual and telephone access; a simplified/centralised manual or flowchart; and mobile reminders for deadlines and news. The municipal plan already includes 2026-2027 actions to systematise/simplify procedures and publish caregiver information digitally, matching the institutional response recorded in EVD-000044."
