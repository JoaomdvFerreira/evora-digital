notes: "D2-B Round A (D2-B-SIG-03). CONFIRMS PRB-0007; INFORMATION-FRICTION, TRANSACTION-FRICTION. One of the clearest direct caregiver-voiced confirmations of the D1 navigation framing found in D2 — a separable information/transaction-cost component rather than merely general caregiver burden. Same SRC-0030 lineage as EVD-000089/EVD-000090; not an independent corroborating source."

