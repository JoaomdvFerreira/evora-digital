notes: "Comparator/mechanism evidence, not Évora-specific. Establishes an operating pattern only — proactive service-status communication can plausibly reduce uncertainty and prevent duplicate reports for already-known disruptions, but no measured outcome (e.g. reduced complaint volume or improved satisfaction) is claimed or established by this review (WU-D4-02 Mechanism A)."

