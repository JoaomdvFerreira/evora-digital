observation:
  summary: "O North Norfolk District Council publica uma lista dos locais onde a recolha não foi efetuada num determinado circuito, pelo que os residentes de uma zona já identificada como afetada não têm de apresentar uma comunicação individual — um exemplo de um padrão mais amplo de comunicação proativa do estado de recolhas atrasadas ou falhadas, também observado noutros municípios do Reino Unido (por exemplo, West Lancashire, West Lothian), selecionado como o único exemplo canónico deste mecanismo."
