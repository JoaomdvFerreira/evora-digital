observation:
  summary: "North Norfolk District Council publishes a list of locations not collected on a given round, so residents in an already-known affected area are not required to submit an individual report — one instance of a broader pattern of proactive delayed/missed-collection status communication also seen at other UK councils (e.g. West Lancashire, West Lothian), selected as the single canonicalized example of this mechanism."
