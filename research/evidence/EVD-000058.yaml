notes: "Provisional ID: D1-05-B-E01. Interpretation: the opportunity here is not simply 'create event metadata' — much of the important schema already exists institutionally. Weakens Batch A's provisional D1-05-A-P01 concern about discoverability/access. Whether this data is publicly reusable/machine-readable is unresolved and carried forward as a next research question."
