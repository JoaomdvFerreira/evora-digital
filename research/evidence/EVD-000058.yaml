observation:
  summary: "O Município já dispõe de um modelo estruturado de recolha de informação sobre eventos. O formulário atual de submissão de eventos inclui campos estruturados para categoria/subcategoria, datas/horas, público-alvo, idioma, local, acessibilidade para pessoas com mobilidade reduzida, acessibilidade comunicacional, inscrição, preço, organizador/contacto e ligações/canais sociais."
