observation:
  summary: "O Volume I do PMUSE documenta informação física heterogénea nas paragens de autocarro: as paragens sem abrigo têm apenas uma placa azul/branca que identifica o operador e a linha, enquanto as paragens com abrigo têm um painel que apresenta linhas/paragens/horários — mas o próprio plano afirma que este painel não dispõe dos elementos de acessibilidade (por exemplo, braille, avisos sonoros) necessários para a acessibilidade universal."
evidence_nature: fact
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "RS-02B1 (docs/discovery/rs-01-evidence-gap-review.md Gap 5). Refines PRB-0002's information-consistency question with a concrete, institutionally-documented physical-channel gap: static stop information is not uniform across the network, and where it exists it is not accessibility-complete. Does not itself establish which stops/lines are affected or how material this is to a real passenger journey — that remains D5/WU023 territory. Distinct fact from TREVO's own digital channels (EVD-000016); this is physical/on-street information, not the website/app."

