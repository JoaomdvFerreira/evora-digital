  summary: "Current evidence weakens a broad claim of unaddressed mental-health capacity: ULSAC operates active psychiatry, community-care and community mental-health initiatives (ECSM-IA, Unidade de Cuidados na Comunidade, Psiquiatria e Saude Mental). The older institutional concern recorded in EVD-000035 remains valid as historical evidence, but Round B does NOT support promoting 'mental-health capacity shortage' as a current canonical problem without utilisation, waiting-time or service-capacity evidence."
