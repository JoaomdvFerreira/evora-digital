observation:
  summary: "O Regulamento Municipal de Cedência e Utilização de Cartografia Digital declara que a informação é fornecida nos formatos dwg, shp, ecw e pdf. Isto confirma a existência de capacidade para fornecer informação geoespacial estruturada (SHP), através de um processo formal de cedência mediante pedido e analisado caso a caso, e não através de um conjunto de dados disponibilizado abertamente ou em regime de autosserviço, nem de uma API pública."
evidence_nature: fact
strength: primary-authoritative
personal_data:
  present: false
  retained: false
notes: "RS-02B1 (docs/discovery/rs-01-evidence-gap-review.md Gap 7). General-purpose municipal cartography-supply capability, not specific to the cycling network — does not itself confirm that a current cycling-network SHP layer exists, is current, or has ever been requested/supplied. Complements SRC-0006/SRC-0007 (municipal/CIMAC geographic-portal and GIS infrastructure), which already establish municipal GIS capability at the infrastructure level; this record adds the specific, request-based format/licensing mechanism."

