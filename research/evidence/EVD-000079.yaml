observation:
  summary: "Cerca de 30 estudantes da Universidade de Évora manifestaram-se no Colégio Pedro da Fonseca, reivindicando horários adicionais de transporte; a reportagem referiu uma petição com mais de 250 assinaturas e relatos de estudantes sobre uma disponibilidade limitada de opções de transporte utilizáveis na prática, autocarros cheios e tempos efetivos de deslocação longos. Um estudante descreveu ter recorrido a um serviço TVDE porque, nessa manhã, os transportes públicos não ofereciam uma opção de deslocação que lhe fosse utilizável."
