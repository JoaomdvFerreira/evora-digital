observation:
  summary: "A APCE refere que as suas avaliações de acessibilidade in loco identificaram problemas de acessibilidade nos acessos (entradas/percursos de acesso), devido a fatores que incluem a inclinação e a localização, e que alguns dos problemas identificados exigiram correção e foram alvo dessa correção. A APCE não forneceu um inventário por localização que identifique os acessos específicos avaliados, os que permanecem por corrigir, nem uma data para a conclusão das correções."
