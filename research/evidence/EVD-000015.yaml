  summary: "The 2026 ATAC contract-evaluation report identifies significant public-information nonconformities during 2025, including absent or outdated maps, schedules and line identification at multiple stops/terminals, and reports that digital information had incomplete/outdated content. The report also finds the waiting/information experience weaker than the in-vehicle experience."
