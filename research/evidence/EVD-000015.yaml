observation:
  summary: "O relatório de avaliação contratual da ATAC de 2026 identifica não conformidades significativas na informação pública durante 2025, incluindo mapas, horários e identificação de linhas ausentes ou desatualizados em várias paragens e terminais, e refere que a informação digital apresentava conteúdo incompleto ou desatualizado. O relatório conclui também que a experiência de espera e de acesso à informação é menos positiva do que a experiência a bordo."
