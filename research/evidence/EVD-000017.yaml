observation:
  summary: "O Município disponibiliza atualmente serviços geográficos interativos através do ecossistema geo.cimac.pt, enquanto a atividade GEOCIMAC da CIMAC para 2026 inclui explicitamente ArcGIS Enterprise/Portal, serviços de mapas, aplicações WebGIS e a criação, manutenção e atualização contínuas de informação geográfica intermunicipal. A CIMAC também enquadra a acessibilidade e a reutilização de informação territorial por cidadãos, academia e empresas como objetivo do projeto."
