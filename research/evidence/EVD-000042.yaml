observation:
  summary: "A intervenção habitacional é ampla e está ativa (financiamento de 67,1 milhões de euros para 459 habitações, 40 habitações para arrendamento acessível no Bairro do Moinho, 122 novas habitações no Bairro do Escurinho, um centro de acolhimento transitório para pelo menos 24 pessoas, previsão de beneficiar cerca de 500 famílias, além de 12 habitações para arrendamento apoiado já entregues na Malagueira em janeiro de 2026), mas isto, por si só, não demonstra que as necessidades habitacionais não satisfeitas estejam resolvidas. O problema habitacional da Ronda A continua a ser estruturalmente credível; a futura formulação do problema deve reconhecer esta intervenção ativa do lado da oferta. Considera-se que a intervenção digital tem baixa capacidade de influência sobre a causa dominante, que é a oferta física/económica."
