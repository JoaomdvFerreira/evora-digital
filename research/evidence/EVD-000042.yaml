observation:
  summary: "Housing intervention is large and active (EUR67.1M funding for 459 homes, 40 affordable-rent homes in Bairro do Moinho, 122 new homes in Bairro do Escurinho, a transitional accommodation centre for at least 24 people, an intended ~500 families benefited, plus 12 supported-rent homes already delivered in Malagueira in January 2026), but this does not by itself demonstrate unmet housing need is resolved. The Round A housing problem remains structurally credible; future problem wording must recognise this active supply-side intervention. Digital intervention is assessed as having low leverage over the dominant cause, which is physical/economic supply."
