observation:
  summary: "A funcionalidade Parking Buddy da Via Verde Estacionar disponibiliza pesquisa de destinos baseada em mapa, com uma indicação verde/amarela/vermelha da probabilidade de encontrar estacionamento, atualizada aproximadamente a cada 30 minutos e calculada a partir dos dados históricos de estacionamento da Via Verde e de fatores externos, como as condições meteorológicas e eventos desportivos ou culturais, com previsões para até 48 horas no futuro. As páginas de serviço da Via Verde Estacionar incluem Évora entre os municípios onde o seu serviço de pagamento de estacionamento na via pública está atualmente disponível."
