  summary: "A acessibilidade, a inclusão e a participação são preocupações explícitas da política cultural. A estratégia cultural inclui explicitamente acessibilidade, inclusão, participação, educação e mediação, bem como mecanismos para democratizar o acesso à cultura, incluindo um apelo à realização de um mapeamento da acessibilidade dos equipamentos culturais."
