notes: "D2-A Round A (D2-A-SIG-04). CONFIRMS PRB-0003 with a concrete factual barrier; CURRENT-STATE-UPDATE required — because the corrective project is current/recent, the post-project condition must be checked before treating the described barrier as present-day reality. This is factual corroboration, not an independent lived public signal."
