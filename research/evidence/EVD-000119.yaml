observation:
  summary: "O Volume I do PMUSE representa cartograficamente (Figura 85) uma expansão proposta da rede ciclável, baseada numa proposta municipal de 2017, de aproximadamente 18 km de novos eixos exclusivamente cicláveis, acrescidos de 33 km do percurso partilhado por peões e ciclistas «Grande Rota do Montado». O próprio texto do plano assinala que a zona nascente da cidade, incluindo a ligação à Escola 2,3 André de Resende, permanece fora da proposta e exigiria estudo adicional."
